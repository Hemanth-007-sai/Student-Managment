<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Student Login</title>
    <style>
      body { margin: 0; padding: 32px 16px; background: #f3f6fb; color: #18304b; font-family: Arial, sans-serif; }
      main { max-width: 440px; margin: 7vh auto; padding: 28px; background: white; border: 1px solid #e1e8f0; border-radius: 12px; box-shadow: 0 8px 24px #173b6710; }
      h1 { color: #173b67; }
      label { display: block; margin: 16px 0 6px; font-weight: 700; }
      input { width: 100%; box-sizing: border-box; padding: 11px; border: 1px solid #cbd6e2; border-radius: 7px; font: inherit; }
      button { margin-top: 20px; padding: 11px 15px; border: 0; border-radius: 7px; background: #1769aa; color: white; font: inherit; cursor: pointer; }
      .error { padding: 11px; color: #a51f2b; background: #fff0f0; border-radius: 7px; }
      a { margin-left: 10px; color: #1769aa; }
    </style>
  </head>
  <body>
    <main>
      <h1>Student Login</h1>
      {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
      <form method="post">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required value="{{ request.form.get('email', '') }}">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" required>
        <button type="submit">Log In</button>
        <a href="{{ url_for('registration.register') }}">Create an account</a>
      </form>
    </main>
  </body>
</html>
