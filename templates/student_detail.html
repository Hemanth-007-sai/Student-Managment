{% extends "base.html" %}
{% block title %}Student Details | Student Management{% endblock %}
{% block content %}
  <section class="card">
    <h1>Student Details</h1>
    <p><strong>Student ID:</strong> {{ student.id }}</p>
    <p><strong>Name:</strong> {{ student.name }}</p>
    <p><strong>Department:</strong> {{ student.department }}</p>
    <div class="form-actions">
      <a class="button" href="{{ url_for('edit_student', student_id=student.id) }}">Edit Student</a>
      <a class="button secondary" href="{{ url_for('home') }}">Back to Records</a>
    </div>
  </section>
{% endblock %}
